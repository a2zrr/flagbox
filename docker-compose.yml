services:
  postgres:
    image: postgres:16
    container_name: flagbox-postgres
    environment:
      POSTGRES_DB: flagbox
      POSTGRES_USER: flagbox
      POSTGRES_PASSWORD: flagbox
    # Host port 5433 avoids clashing with a PostgreSQL already installed on the host (5432).
    ports:
      - "5433:5432"
    volumes:
      - flagbox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagbox -d flagbox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flagbox-pgdata:
