# Own project name, so this stack never shares containers with docker-compose.yml (the dev database).
name: flagbox-full

# The whole stack: FlagBox and PostgreSQL 16, started with one command:
#   docker compose -f docker-compose.full.yml up --build
# The bootstrap admin key comes from .env (copy .env.example and fill it in).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flagbox
      POSTGRES_USER: flagbox
      POSTGRES_PASSWORD: flagbox
    volumes:
      - flagbox-full-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagbox -d flagbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLAGBOX_DB_URL: jdbc:postgresql://postgres:5432/flagbox
      FLAGBOX_DB_USER: flagbox
      FLAGBOX_DB_PASSWORD: flagbox
      FLAGBOX_BOOTSTRAP_ADMIN_KEY: ${FLAGBOX_BOOTSTRAP_ADMIN_KEY:?set FLAGBOX_BOOTSTRAP_ADMIN_KEY in .env}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  flagbox-full-pgdata:
