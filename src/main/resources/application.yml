spring:
  application:
    name: flagbox
  profiles:
    default: dev
  datasource:
    url: ${FLAGBOX_DB_URL:jdbc:postgresql://localhost:5433/flagbox}
    username: ${FLAGBOX_DB_USER:flagbox}
    password: ${FLAGBOX_DB_PASSWORD:flagbox}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dev.a2zrr.flagbox: INFO
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    dev.a2zrr.flagbox: DEBUG
---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
logging:
  level:
    dev.a2zrr.flagbox: INFO
